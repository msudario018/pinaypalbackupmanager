name: Deploy to GitHub Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy-to-github-releases:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get Version from Project File
        id: get-version
        shell: bash
        run: echo "version=$(grep -oE '<Version>[^<]+' PinayPalBackupManager.csproj | sed 's/<Version>//')" >> $GITHUB_OUTPUT

      - name: Get Changelog
        id: get-changelog
        shell: bash
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          awk -v ver="$VERSION" '/^## /{ if(p) exit; if(index($0, ver)>0){ p=1; next } } p{ sub(/\r$/,""); print }' CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "Release v$VERSION" > release_notes.txt
          fi

      - name: Publish Application
        run: dotnet publish PinayPalBackupManager.csproj -c Release -o publish -r win-x64 --self-contained true

      - name: Create Velopack Release
        shell: bash
        env:
          SIGN_CERT: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PASS: ${{ secrets.SIGN_PASSWORD }}
        run: |
          dotnet tool install -g vpk || dotnet tool update -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} || true
          
          TARGET_VERSION="${{ steps.get-version.outputs.version }}"
          echo "Packaging Target Version: $TARGET_VERSION"
          if [ -d "Releases" ]; then
            echo "Existing releases in ./Releases:"
            ls -la Releases/
            # Remove any existing package matching target version to prevent Velopack conflict
            rm -f "Releases/PinayPal.PinayPalBackupManager-${TARGET_VERSION}"*
          fi

          # Build signing args if secrets exist
          SIGN_ARGS=""
          if [ -n "$SIGN_CERT" ] && [ -n "$SIGN_PASS" ]; then
            echo "$SIGN_CERT" | base64 -d > cert.pfx
            SIGN_ARGS="--signCert cert.pfx --signPassword $SIGN_PASS"
            echo "Code signing enabled"
          fi
          
          vpk pack -u PinayPal.PinayPalBackupManager -v "$TARGET_VERSION" -p publish --mainExe PinayPalBackupManager.exe --icon Assets/logo.ico --runtime win-x64 $SIGN_ARGS
                    echo "Attempting Velopack upload..."
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "PinayPalBackupManager $TARGET_VERSION" --tag "v$TARGET_VERSION" --token ${{ secrets.GITHUB_TOKEN }} --merge || {
            echo "Release conflict encountered, deleting existing release object and retrying..."
            gh release delete "v$TARGET_VERSION" --yes || true
            vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "PinayPalBackupManager $TARGET_VERSION" --tag "v$TARGET_VERSION" --token ${{ secrets.GITHUB_TOKEN }}
          }

      - name: Update Release Notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_VERSION="${{ steps.get-version.outputs.version }}"
          gh release edit "v$TARGET_VERSION" --notes-file release_notes.txt || echo "Failed to update release notes"
