name: Build iOS Native App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build & Package PinayPal iOS IPA
        run: |
          set -eo pipefail

          echo "==> Building PinayPalBackup target..."
          xcodebuild clean build \
            -project ios/PinayPalBackup.xcodeproj \
            -scheme PinayPalBackup \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "==> Locating compiled PinayPalBackup.app bundle..."
          APP_PATH=$(find . -name "PinayPalBackup.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PinayPalBackup.app bundle was not found!"
            find . -maxdepth 5
            exit 1
          fi

          echo "==> Found bundle at: $APP_PATH"

          echo "==> Packaging into Payload structure for Feather & sideloaders..."
          rm -rf ipa_staging PinayPalBackup.ipa
          mkdir -p ipa_staging/Payload
          cp -R "$APP_PATH" ipa_staging/Payload/

          echo "==> Creating PinayPalBackup.ipa..."
          cd ipa_staging
          zip -r -y ../PinayPalBackup.ipa Payload
          cd ..

          echo "==> Verification:"
          ls -lh PinayPalBackup.ipa
          du -h PinayPalBackup.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinayPalBackup-iOS-${{ github.ref_name }}
          path: PinayPalBackup.ipa
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attaching PinayPalBackup.ipa to GitHub Release ${{ github.ref_name }}..."
          for i in {1..15}; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "GitHub release ${{ github.ref_name }} found. Uploading IPA..."
              gh release upload "${{ github.ref_name }}" PinayPalBackup.ipa --clobber
              echo "Successfully attached PinayPalBackup.ipa to ${{ github.ref_name }}"
              exit 0
            fi
            echo "Waiting for GitHub release ${{ github.ref_name }} to be created (attempt $i/15)..."
            sleep 10
          done
          echo "Fallback: creating release with IPA directly..."
          gh release create "${{ github.ref_name }}" PinayPalBackup.ipa --title "PinayPalBackupManager ${{ github.ref_name }}" --notes "PinayPal iOS IPA build" || true
