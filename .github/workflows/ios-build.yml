name: Build iOS Native App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build & Package PinayPal iOS IPA
        run: |
          set -eo pipefail

          echo "==> Building PinayPalBackup target..."
          xcodebuild clean build \
            -project ios/PinayPalBackup.xcodeproj \
            -scheme PinayPalBackup \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "==> Locating compiled PinayPalBackup.app bundle..."
          APP_PATH=$(find . -name "PinayPalBackup.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PinayPalBackup.app bundle was not found!"
            find . -maxdepth 5
            exit 1
          fi

          echo "==> Found bundle at: $APP_PATH"

          echo "==> Packaging into Payload structure for Feather & sideloaders..."
          rm -rf ipa_staging PinayPalBackup.ipa
          mkdir -p ipa_staging/Payload
          cp -R "$APP_PATH" ipa_staging/Payload/

          echo "==> Creating PinayPalBackup.ipa..."
          cd ipa_staging
          zip -r -y ../PinayPalBackup.ipa Payload
          cd ..

          echo "==> Verification:"
          ls -lh PinayPalBackup.ipa
          du -h PinayPalBackup.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinayPalBackup-iOS-v3.2.3
          path: PinayPalBackup.ipa
          retention-days: 14
